version: '3.8'

services:
  # Laravel API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voyagenest-api
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=voyagenest
      - DB_USERNAME=voyagenest
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - voyagenest

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: voyagenest-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=voyagenest
      - MYSQL_USER=voyagenest
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - voyagenest

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: voyagenest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voyagenest

  # Web Frontend
  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: voyagenest-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - voyagenest

  # Admin Frontend
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: voyagenest-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - voyagenest

networks:
  voyagenest:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
