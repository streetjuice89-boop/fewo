version: '3.8'

services:
  # NestJS API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: voyagenest-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/voyagenest.db
      - JWT_SECRET=${JWT_SECRET:-voyagenest-production-secret-change-me}
      - JWT_EXPIRATION=7d
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_URL=http://localhost:3002
    volumes:
      - api-data:/app/data
    networks:
      - voyagenest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: voyagenest-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001/api
    depends_on:
      - api
    networks:
      - voyagenest
    restart: unless-stopped

  # Next.js Admin Panel
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: voyagenest-admin
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001/api
    depends_on:
      - api
    networks:
      - voyagenest
    restart: unless-stopped

networks:
  voyagenest:
    driver: bridge

volumes:
  api-data:

